<body>
    <main> <!-- Maximum width of Main content area is 1200px -->

        <!-- = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

          HEADER AND NAVIGATION
    
        = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = -->

        <header>
            <a href="index.html" class="logo">wear this.</a>
            <nav class="topnav" id="myTopnav">
                <a href="index.html">Home</a>
                <a href="explore.html">Explore</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="current-page">Contact</a>
            </nav>
            <button type="button" class="icon" id="menuToggle" onclick="toggleMenu()" aria-label="Toggle menu" aria-expanded="false" aria-controls="myTopnav">
                <span class="material-symbols-outlined" id="menuIcon">menu</span>
            </button>
        </header>

               <!-- CONTACT SECTION -->
        <section class="contact-section">
            <div class="contact-section__inner">
                <h1>Get in touch</h1>
                <p class="contact-intro">For any inquiries please fill out the contact form below.</p>

                <form name="contact" method="POST" data-netlify="true" class="contact-form" action="/contact-success.html">
                    <input type="hidden" name="form-name" value="contact">

                    <p class="contact-form__name">
                        <label for="name">Your Name: </label><input type="text" id="name" name="name" placeholder="Name" required />
                    </p>
                    <p class="contact-form__email">
                        <label for="email">Your Email: </label><input type="email" id="email" name="email" placeholder="Email" required />
                    </p>
                    <p class="contact-form__phone-number">
                        <label for="phone-number">Your mobile number: </label><input type="tel" id="phone-number" name="phone-number" placeholder="+64" required />
                    </p>
                    <p class="contact-form__experience">
                        <label for="experience">How was your experience using this website?: </label>
                        <select id="experience" name="experience[]" required>
                            <option value="" disabled selected>Select from list</option>
                            <option value="5">Excellent</option>
                            <option value="4">Good</option>
                            <option value="3">Okay</option>
                            <option value="2">Bad</option>
                            <option value="1">Very bad</option>
                        </select>
                    </p>
                      <p class="contact-form__message">
                        <label for="message">Message: </label><textarea id="message" name="message" rows="7" cols="60"
                            placeholder="Type your message. . ."></textarea>
                    </p>
                    <p class="contact-form__submit">
                        <button type="submit">Submit</button>
                    </p>
                </form>
            </div>
        </section>

        <!-- = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =

                <a href="#"><img src="images/instagram.svg" alt="Instagram"></a>
                <a href="#"><img src="images/tiktok.svg" alt="TikTok"></a>
                <a href="#"><img src="images/pinterest.svg" alt="Pinterest"></a>
            </div>
        </footer>

   <!-- JavaScript for the MOBILE NAV MENU -->
    <script>
        function toggleMenu() {
            const nav = document.getElementById("myTopnav");
            const icon = document.getElementById("menuIcon");
            const btn = document.getElementById("menuToggle");

            const isOpen = nav.classList.toggle("responsive");
            icon.textContent = isOpen ? "close" : "menu";
            btn.setAttribute("aria-expanded", isOpen);
        }
    </script>

</body>
